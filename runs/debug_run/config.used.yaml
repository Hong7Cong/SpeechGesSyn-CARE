data:
  batch_size: 2
  max_len: 16
  num_workers: 2
  pin_memory: true
  resize: 224
  test_csv: /project2/shrikann_35/hongn/SpeechGesSyn-CARE/test.csv
  train_csv: /project2/shrikann_35/hongn/SpeechGesSyn-CARE/clips2.csv
  val_csv: null
  val_split: 0.2
device: cuda:0
experiment_name: debug_run
logger:
  log_interval: 50
loss:
  losses:
  - name: tri_semantic
    temperature: 0.07
    weight: 1.0
  - kwargs:
      lambda_energy: 0.5
    name: trajectory
    weight: 0.5
  name: combined
model: {}
optim:
  betas:
  - 0.9
  - 0.999
  lr: 0.001
  weight_decay: 0
output_dir: runs/debug_run
train:
  accum_steps: 8
  amp: true
  epochs: 100
  grad_clip_norm: 1.0
  val_every: 1
